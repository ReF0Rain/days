name: Android CI

# ---------------------------------------------------------------------------
# 触发时机
#   - push 到 main / master / dev / develop   -> 构建 debug（+release 验证）并上传 artifact
#   - 任何指向 main / master 的 Pull Request   -> 只做构建与测试校验
#   - 手动触发（Actions 页面 Run workflow）     -> 可选是否构建 release
#   - push 版本 tag（v1.0.0 这种）             -> 正式签名构建 + 自动发布 GitHub Release
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main, master, dev, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_release:
        description: "同时构建 release APK"
        type: boolean
        default: true

# 同一分支连续 push 时取消上一次未完成的构建，省额度（tag 构建不取消）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ==========================================================================
  # 常规构建：任何 push / PR 都跑，保证主分支随时可构建
  # ==========================================================================
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 8.6 / AGP 8.4 只支持 JDK 17~21，runner 默认可能更新，这里显式锁定
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 只负责依赖缓存；gradlew 由仓库自带（不依赖系统 gradle 命令）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle wrapper
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew printSigningInfo -q

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: countdown-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_release
        uses: actions/upload-artifact@v4
        with:
          name: countdown-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 失败时把单测堆栈打进日志：GitHub 下载 artifact / 原始日志都要求登录，
      # 但 job 日志是公开可读的，方便直接定位问题
      - name: Show unit test failures
        if: failure()
        run: |
          set -uo pipefail
          found=0
          while IFS= read -r f; do
            found=1
            echo "===== $f ====="
            grep -n -A 40 '<failure\|<error' "$f" | head -n 160 || true
          done < <(find app/build/test-results -name '*.xml' 2>/dev/null || true)
          [ "$found" -eq 0 ] && echo "没有找到 test-results XML（可能是编译失败）"
          exit 0

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================================================
  # 正式发版：只在 push v* tag 时运行
  #   需要仓库配置 4 个 Secrets（见 README「Release 正式签名」）：
  #     KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
  #   未配置时不会失败，但会以 debug 签名发布并在 Release 说明里标注警告
  # ==========================================================================
  release:
    name: Publish release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # 创建 Release 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # 把 base64 的 keystore 还原成文件；Secret 缺失时跳过并给出警告
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次 release 将回落到 debug 签名"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/countdown.jks
          ls -l keystore/countdown.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          COUNTDOWN_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && 'keystore/countdown.jks' || '' }}
          COUNTDOWN_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          COUNTDOWN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          COUNTDOWN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          ./gradlew :app:assembleRelease printSigningInfo --stacktrace
          ls -l app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          {
            echo "### Release 构建结果"
            echo ""
            echo "- 版本: ${GITHUB_REF_NAME}"
            echo "- APK: \`$(basename "$APK")\` ($(du -h "$APK" | cut -f1))"
            echo "- 签名证书:"
            echo '```'
            "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "$APK" \
              | grep -E 'certificate DN|SHA-256 digest' | head -n 2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # R8 mapping 表：还原线上崩溃栈、排查混淆问题都要用
      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/apk/release/*.apk
          body: |
            > 由 GitHub Actions 自动构建（commit `${{ github.sha }}`）。
            > 下载下面的 APK 传到手机即可安装；安装前需允许「安装未知来源应用」。

            **签名**：${{ steps.keystore.outputs.signed == 'true' && '正式 keystore' || '⚠️ debug 签名（仓库未配置 Secrets，仅供测试）' }}
