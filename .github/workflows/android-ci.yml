name: Android CI

# ---------------------------------------------------------------------------
# 触发时机
#   - push 到 main / master / dev / develop
#   - 任何指向 main / master 的 Pull Request
#   - 手动触发（Actions 页面点 "Run workflow"，可选只出 debug 或 debug+release）
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_release:
        description: "同时构建 release APK"
        type: boolean
        default: true

# 同一分支连续 push 时，取消上一次还没跑完的构建，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只读权限即可（用 artifact 上传，不需要写仓库）
permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1) 拉代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2) 安装 Java 17（AGP 8.4 支持 17~21；Gradle 8.6 不能在 JDK 25 上运行）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) 配置 Gradle 缓存（不负责安装 gradle 命令，下面一律使用仓库内的 ./gradlew）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4) 权限 + 环境自检：gradlew 已提交进仓库，这里只做可执行位与版本确认
      - name: Verify Gradle wrapper
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ls -l gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          # 缺 jar 时用官方发行包补一个（正常情况下不会走到这里）
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning::gradle-wrapper.jar missing, fetching official Gradle ${GRADLE_VERSION:-8.6} distribution"
            curl -fsSL -o /tmp/gradle-dist.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
            unzip -o -q /tmp/gradle-dist.zip -d /tmp/gradle-dist
            /tmp/gradle-dist/gradle-8.6/bin/gradle wrapper --gradle-version 8.6 --distribution-type bin
            chmod +x ./gradlew
          fi
          ./gradlew --version
          java -version

      # 5) 跑单元测试（失败即中断，保证产物不是“带病”的）
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # 5b) 把失败用例的堆栈直接打进日志（GitHub 下载 artifact 要求登录，日志是公开可读的）
      - name: Show unit test failures
        if: failure()
        run: |
          set -uo pipefail
          found=0
          while IFS= read -r f; do
            found=1
            echo "===== $f ====="
            grep -n -A 40 '<failure\|<error' "$f" | head -n 160 || true
          done < <(find app/build/test-results -name '*.xml' 2>/dev/null || true)
          [ "$found" -eq 0 ] && echo "没有找到 test-results XML（可能是编译失败）"
          exit 0

      # 6) 构建 debug APK
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 7) 构建 release APK（未配置 keystore 时会自动回落到 debug 签名，仍可安装）
      - name: Build release APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_release
        run: ./gradlew :app:assembleRelease --stacktrace

      # 8) 上传 artifact：debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: countdown-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 9) 上传 artifact：release
      - name: Upload release APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_release
        uses: actions/upload-artifact@v4
        with:
          name: countdown-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 10) 构建失败时把完整日志也传上去，方便定位
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
