name: Android CI

# ---------------------------------------------------------------------------
# 触发时机
#   - push 到 main / master / dev / develop   -> 构建 debug（+release 验证）并上传 artifact
#   - 任何指向 main / master 的 Pull Request   -> 只做构建与测试校验
#   - 手动触发（Actions 页面 Run workflow）     -> 可选是否构建 release
#   - push 版本 tag（v1.0.0 这种）             -> 正式签名构建 + 自动发布 GitHub Release
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main, master, dev, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_release:
        description: "同时构建 release APK"
        type: boolean
        default: true
      diagnostics:
        description: "只跑签名 Secret 诊断（不构建，用来排查发版签名问题）"
        type: boolean
        default: false

# 同一分支连续 push 时取消上一次未完成的构建，省额度（tag 构建不取消）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ==========================================================================
  # 常规构建：任何 push / PR 都跑，保证主分支随时可构建
  # ==========================================================================
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 8.6 / AGP 8.4 只支持 JDK 17~21，runner 默认可能更新，这里显式锁定
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 只负责依赖缓存；gradlew 由仓库自带（不依赖系统 gradle 命令）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle wrapper
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew printSigningInfo -q

      # 单元测试 + 截图测试。
      # 注意：必须带 -Droborazzi.test.record=true —— Roborazzi 默认不写文件；
      # 而且它产出的 PNG 不在 Gradle 的 output 声明里，一旦 test 任务被判定
      # UP-TO-DATE 就直接跳过、什么图都不会生成。
      - name: Run unit tests and screenshots
        run: ./gradlew :app:testDebugUnitTest --stacktrace -Droborazzi.test.record=true

      # 上传卡片渲染图，供人工核对 UI 改动（这解决了"看不到界面"的问题）
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: countdown-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_release
        uses: actions/upload-artifact@v4
        with:
          name: countdown-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 失败时把单测堆栈打进日志：GitHub 下载 artifact / 原始日志都要求登录，
      # 但 job 日志是公开可读的，方便直接定位问题
      - name: Show unit test failures
        if: failure()
        run: |
          set -uo pipefail
          found=0
          while IFS= read -r f; do
            found=1
            echo "===== $f ====="
            grep -n -A 40 '<failure\|<error' "$f" | head -n 160 || true
          done < <(find app/build/test-results -name '*.xml' 2>/dev/null || true)
          [ "$found" -eq 0 ] && echo "没有找到 test-results XML（可能是编译失败）"
          exit 0

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================================================
  # 签名诊断：仅手动触发（Actions -> Run workflow -> 勾选 diagnostics）
  # 目的：把 4 个签名 Secret 的"自证信息"（长度 / 首尾字符 / 解码字节数 / SHA256）
  # 打进公开可读的 job 日志。Secret 内容本身不会被打印。
  # ==========================================================================
  diagnostics:
    name: Signing secrets check
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -uo pipefail
          echo "############ 签名 Secret 诊断 ############"
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            value="${!name:-}"
            printf '%-20s 长度=%-6s 空=%s\n' "$name" "${#value}" "$([ -z "$value" ] && echo YES || echo no)"
          done
          echo

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 为空或未配置"
            exit 1
          fi

          echo "base64 原始长度: ${#KEYSTORE_BASE64}（期望 3668）"
          CLEAN=""; BAD=0; BAD_LIST=""
          for (( i=0; i<${#KEYSTORE_BASE64}; i++ )); do
            ch="${KEYSTORE_BASE64:i:1}"
            case "$ch" in
              [A-Za-z0-9+/=]) CLEAN="${CLEAN}${ch}" ;;
              *) BAD=$((BAD+1))
                 [ ${#BAD_LIST} -lt 24 ] && BAD_LIST="${BAD_LIST}$(printf '0x%02X ' "'$ch")" ;;
            esac
          done
          BADHASH=$(printf '%s' "$BAD_LIST" | sha256sum | cut -c1-16)
          echo "非法字符数: ${BAD}  十六进制(sha256 前16=${BADHASH}): ${BAD_LIST}"
          echo "清洗后长度: ${#CLEAN}"
          echo "前 24: ${CLEAN:0:24}"
          echo "末 16: ${CLEAN: -16}"

          REM=$(( ${#CLEAN} % 4 ))
          echo "长度对 4 取余: ${REM}"
          [ "$REM" -eq 2 ] && CLEAN="${CLEAN}=="
          [ "$REM" -eq 3 ] && CLEAN="${CLEAN}="

          printf '%s' "$CLEAN" | base64 --decode > /tmp/ks.jks 2>/tmp/b64err.txt
          if [ $? -ne 0 ]; then
            echo "::error::base64 解码失败"
            cat /tmp/b64err.txt || true
            exit 1
          fi
          echo "解码字节数: $(stat -c%s /tmp/ks.jks)（期望 2750）"
          echo "sha256: $(sha256sum /tmp/ks.jks | cut -d' ' -f1)"
          echo "期望  : e31d6cc7fc8788cef0cd76d7f00a3bd9d2a4f17234b60297ef57e87478893289"

          KT=$(command -v keytool || true)
          [ -z "$KT" ] && [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ] && KT="${JAVA_HOME}/bin/keytool"
          if [ -n "$KT" ]; then
            if "$KT" -list -keystore /tmp/ks.jks -storepass "$KEYSTORE_PASSWORD" 2>/tmp/kt.txt; then
              echo "keystore 口令校验: 通过"
              "$KT" -list -v -keystore /tmp/ks.jks -storepass "$KEYSTORE_PASSWORD" \
                | grep -E 'Alias name|SHA256:' | head -n 4
            else
              echo "keystore 口令校验: 失败"
              cat /tmp/kt.txt || true
            fi
          else
            echo "未找到 keytool，跳过口令校验"
          fi

          # 兼容检查：Secret 里是否塞的是 dotenv/JSON 文本而不是纯 base64
          if printf '%s' "$KEYSTORE_BASE64" | grep -q 'KEYSTORE_BASE64[[:space:]]*='; then
            echo "::error::KEYSTORE_BASE64 里似乎包含 'KEYSTORE_BASE64=' 这样的键名，"
            echo "::error::说明粘贴的是整个文件而不是文件内容。请只粘贴 base64 字符串本身。"
          fi
          if printf '%s' "$KEYSTORE_BASE64" | grep -q '"KEYSTORE_BASE64"'; then
            echo "::error::KEYSTORE_BASE64 里似乎包含 JSON 键名，请只粘贴 base64 字符串。"
          fi

  # ==========================================================================
  # 正式发版：只在 push v* tag 时运行
  #   需要仓库配置 4 个 Secrets（见 README「Release 正式签名」）：
  #     KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
  #   未配置时不会失败，但会以 debug 签名发布并在 Release 说明里标注警告
  # ==========================================================================
  release:
    name: Publish release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # 创建 Release 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # 把 base64 的 keystore 还原成文件；Secret 缺失时跳过并给出警告。
      # 注意：不做 `echo "$SECRET" | base64 -d` —— Secret 里如果混入换行/空格/BOM，
      # base64 会直接报 "invalid input" 让整个发版失败。这里先清洗再解码，并校验文件确实是 keystore。
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次 release 将回落到 debug 签名"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Secret 原始长度: ${#KEYSTORE_BASE64}"
          # 逐字符扫描，找出 base64 字母表之外的字符（换行/空格/BOM/全角字符等）。
          # 用纯 bash 判断，不依赖 tr 的区域设置行为（不同 locale 下 [:space:] 可能不一致），
          # 而且非 ASCII 字节按字节处理也不会被截断。
          CLEAN=""
          BAD=0
          BAD_LIST=""
          for (( i=0; i<${#KEYSTORE_BASE64}; i++ )); do
            ch="${KEYSTORE_BASE64:i:1}"
            case "$ch" in
              [A-Za-z0-9+/=]) CLEAN="${CLEAN}${ch}" ;;
              *) BAD=$((BAD+1))
                 if [ ${#BAD_LIST} -lt 20 ]; then
                   BAD_LIST="${BAD_LIST}$(printf '0x%02X ' "'$ch")"
                 fi ;;
            esac
          done
          echo "清洗后长度: ${#CLEAN}"
          if [ "$BAD" -eq 0 ]; then
            echo "Secret 干净，无多余字符"
          else
            echo "::notice::Secret 含 ${BAD} 个 base64 字母表外的字符（已自动剔除）: ${BAD_LIST}"
            echo "::notice::这通常是把文件内容复制进 Secret 时带进了换行或空格，建议重新粘贴"
          fi
          echo "参考值：正确内容 3668 字符，解码后 2750 字节，sha256=e31d6cc7fc8788cef0cd76d7f00a3bd9d2a4f17234b60297ef57e87478893289"
          if [ "${#CLEAN}" -gt 0 ]; then
            echo "清洗后前 24 字符: ${CLEAN:0:24}"
            echo "清洗后末 16 字符: ${CLEAN: -16}"
          fi

          if [ "${#CLEAN}" -lt 3000 ]; then
            echo "::error::清洗后仅 ${#CLEAN} 个字符，Secret 内容明显不完整（应约 3668）"
            echo "::error::请执行: Get-Content keystore\\keystore.base64.txt | Set-Clipboard 后重新粘贴 KEYSTORE_BASE64"
            exit 1
          fi

          # 规范 base64 长度必须是 4 的倍数，缺的补位符补上（容忍被省略的尾部 '='）
          REM=$(( ${#CLEAN} % 4 ))
          if [ "$REM" -eq 2 ]; then CLEAN="${CLEAN}=="
          elif [ "$REM" -eq 3 ]; then CLEAN="${CLEAN}="
          elif [ "$REM" -eq 1 ]; then
            echo "::error::base64 长度 ${#CLEAN} 对 4 取余为 1，内容不合法（可能缺字符）"
            exit 1
          fi

          mkdir -p keystore
          if ! printf '%s' "$CLEAN" | base64 --decode > keystore/countdown.jks 2>/dev/null; then
            echo "::error::base64 解码失败"
            exit 1
          fi

          # 解密后的字节数 + SHA256 是判断"Secret 内容是否正确"的决定性证据
          SIZE=$(stat -c%s keystore/countdown.jks)
          HASH=$(sha256sum keystore/countdown.jks | cut -d' ' -f1)
          echo "解码后大小: ${SIZE} bytes（应为 2750）"
          echo "解码后 sha256: ${HASH}"
          echo "期望     sha256: e31d6cc7fc8788cef0cd76d7f00a3bd9d2a4f17234b60297ef57e87478893289"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::解码结果只有 ${SIZE} 字节，Secret 内容不完整。"
            exit 1
          fi

          # 校验 keystore 真的能被口令打开。
          # keytool 一般在 PATH 里（actions/setup-java 会加），但这里仍带 JAVA_HOME 兜底，
          # 且 keytool 本身不可用时只警告不中断，避免首次发版卡在环境细节上。
          KEYTOOL=$(command -v keytool || true)
          if [ -z "$KEYTOOL" ] && [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
            KEYTOOL="${JAVA_HOME}/bin/keytool"
          fi
          if [ -z "$KEYTOOL" ]; then
            echo "::warning::找不到 keytool，跳过 keystore 口令校验"
          elif "$KEYTOOL" -list -keystore keystore/countdown.jks \
                 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null 2>&1; then
            echo "keystore 校验通过（口令正确）"
          else
            echo "::error::keystore 无法用 KEYSTORE_PASSWORD 打开，请检查该 Secret 是否与实际口令一致。"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          COUNTDOWN_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && 'keystore/countdown.jks' || '' }}
          COUNTDOWN_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          COUNTDOWN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          COUNTDOWN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          ./gradlew :app:assembleRelease printSigningInfo --stacktrace
          ls -l app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          {
            echo "### Release 构建结果"
            echo ""
            echo "- 版本: ${GITHUB_REF_NAME}"
            echo "- APK: \`$(basename "$APK")\` ($(du -h "$APK" | cut -f1))"
            echo "- 签名证书:"
            echo '```'
            "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "$APK" \
              | grep -E 'certificate DN|SHA-256 digest' | head -n 2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # R8 mapping 表：还原线上崩溃栈、排查混淆问题都要用
      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/apk/release/*.apk
          body: |
            > 由 GitHub Actions 自动构建（commit `${{ github.sha }}`）。
            > 下载下面的 APK 传到手机即可安装；安装前需允许「安装未知来源应用」。

            **签名**：${{ steps.keystore.outputs.signed == 'true' && '正式 keystore' || '⚠️ debug 签名（仓库未配置 Secrets，仅供测试）' }}
